hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra: []
    task:
    - run_name=avalon_2nd_floor
    - dataset=avalon_2nd_floor
    - grid=avalon_2nd_floor
    - data=test
    - task=scheduled_2branch
    - test_cfg.test_name=outbest_encoder
    - test_cfg.minimal=true
    - test_cfg.model_path="/home/anastasia/Desktop/Repos/niloc/outputs/2026-03-30/23-42-04/<path>/models/avalon_2nd_floor_syn/version_0/epoch=255-tr_ratio=0.6-val_loss=10.22.ckpt"
    - +test_cfg.with_gt=1
    - +test_cfg.encoder_only=True
  job:
    name: evaluate
    override_dirname: +test_cfg.encoder_only=True,+test_cfg.with_gt=1,data=test,dataset=avalon_2nd_floor,grid=avalon_2nd_floor,run_name=avalon_2nd_floor,task=scheduled_2branch,test_cfg.minimal=true,test_cfg.model_path="/home/anastasia/Desktop/Repos/niloc/outputs/2026-03-30/23-42-04/<path>/models/avalon_2nd_floor_syn/version_0/epoch=255-tr_ratio=0.6-val_loss=10.22.ckpt",test_cfg.test_name=outbest_encoder
    id: ???
    num: ???
    config_name: defaults
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.1.1
    cwd: /home/anastasia/Desktop/Repos/niloc
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/anastasia/Desktop/Repos/niloc/niloc/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    choices:
      train_cfg/scheduler: WarmupReduceLROnPlateau
      train_cfg/optimizer: AdamW
      trainer_cfg: default
      arch: transformer_2branch
      io: default
      task: scheduled_2branch
      data: test
      dataclass: txt_velocity_likelihood
      dataset: avalon_2nd_floor
      grid: avalon_2nd_floor
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
