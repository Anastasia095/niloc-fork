grid:
  size:
  - 411
  - 221
  bounds:
  - 0
  - 411
  - 0
  - 221
  cell_length: 1.0
  elements: 90831
  image_file: ../niloc/data/avalon/floorplan.png
  dpi: 10
dataset:
  name: avalon_synthetic
  root_dir: ${oc.env:NILOC_DATA_ROOT}/avalon/synthetic_output
  train_list: ${dataset.root_dir}/train.txt
  val_list: ${dataset.root_dir}/val.txt
data:
  classes:
    sequence: VelocityGridSequence
    dataset: GlobalLocDataset
  batch_size: 10
  imu_base_freq: 10.0
  imu_freq: 10.0
  window:
    window_time: 20.1
    sample_freq: 1.0
  transform:
    accel_bias_range: 0.2
    gyro_bias_range: 0.05
    scale_sigma: 0.05
    yaw_drift_sigma: 0.01
  transformers:
    yaw_drift: false
    perturb_scale: false
    do_bias_shift: false
    reverse_direction: false
    rotate_yaw: null
task: scheduled_2branch
train_cfg:
  tr_ratio: 1.0
  arre: 5
  arrf: 0.01
  tr_warmup: 75
  optimizer:
    name: AdamW
    eps: 1.0e-08
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.01
    amsgrad: false
  scheduler:
    name: WarmupReduceLROnPlateau
    monitor: val_loss
    multiplier: 1.0
    warmup_epochs: 30
    mode: min
    factor: 0.75
    patience: 10
    min_lr: 1.0e-12
    eps: 1.0e-08
  lr: 0.0003
  epochs: 800
  resume_from_checkpoint: null
  load_weights_only: false
  gpus: 1
  accelerator: null
  num_workers: 8
  retry_from_last: true
io:
  root_path: <path>
  folder_name: models
arch:
  name: transformer_2branch
  d_model: 672
  nhead: 8
  d_feedforward: 750
  encoder_layers: 2
  decoder_layers: 2
  encoder_only_layers: 2
  dropout: 0.2
  sample: 10
trainer_cfg:
  gradient_clip_val: 1.0
run_name: avalon_2nd_floor
random_seed: 0
network:
  input_dim: 2
  output_dim: -1
test_cfg:
  minimal: true
  save_n_plots: null
  model_path: /home/anastasia/Desktop/Repos/niloc/outputs/2026-03-30/23-42-04/<path>/models/avalon_2nd_floor_syn/version_0/epoch=255-tr_ratio=0.6-val_loss=10.22.ckpt
  hparam_path: null
  test_name: outbest_start_gt_2
  smooth: true
  filter: 5
  save_output_trajectory: true
  full_traj_heatmap: true
  individual_traj_heatmap: true
  full_error_bar: true
  ffmpeg_path: null
  start_gt: 2
  decoder_only: true
